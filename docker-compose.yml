version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustlens-postgres
    environment:
      POSTGRES_DB: trustlens
      POSTGRES_USER: trustlens
      POSTGRES_PASSWORD: trustlens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
