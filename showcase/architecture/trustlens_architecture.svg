<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">TRUSTLENS SYSTEM ARCHITECTURE</text>
  <text x="500" y="68" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">END-TO-END MULTIMODAL MARKETPLACE EVIDENCE PIPELINE</text>

  <!-- Flow 1: Observation Layer -->
  <g transform="translate(350, 90)">
    <rect width="300" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <text x="150" y="24" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Marketplace Observation Ingestion</text>
    <text x="150" y="40" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">2,980 Canonical Listings • Deduplicated Search Captures</text>
  </g>

  <!-- Branch lines -->
  <path d="M 500 140 L 500 165 L 260 165 L 260 185" fill="none" stroke="#64748b" stroke-width="1.5" />
  <path d="M 500 140 L 500 165 L 740 165 L 740 185" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- Branch Left: Listing & Text Modality -->
  <g transform="translate(100, 185)">
    <rect width="320" height="155" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="160" y="22" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">LISTING &amp; TEXT MODALITY</text>
    
    <!-- Sub-boxes -->
    <rect x="15" y="35" width="140" height="50" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="85" y="55" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Price Intelligence</text>
    <text x="85" y="72" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Comparable Median Delta</text>

    <rect x="165" y="35" width="140" height="50" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="235" y="55" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Text Intelligence</text>
    <text x="235" y="72" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">N-Grams, TF-IDF, Cues</text>

    <rect x="15" y="95" width="290" height="45" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="160" y="115" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Product Taxonomy Normalizer</text>
    <text x="160" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Model Parsing, Brand, Storage, Accessory Filter</text>
  </g>

  <!-- Branch Right: Media & Image Modality -->
  <g transform="translate(580, 185)">
    <rect width="320" height="155" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="160" y="22" text-anchor="middle" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">IMAGE &amp; FORENSIC MODALITY</text>

    <!-- Sub-boxes -->
    <rect x="15" y="35" width="140" height="50" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="85" y="55" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Fingerprinting</text>
    <text x="85" y="72" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">SHA-256, pHash, dHash</text>

    <rect x="165" y="35" width="140" height="50" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="235" y="55" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">DINOv2 Embeddings</text>
    <text x="235" y="72" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">384-d Visual Neighbors</text>

    <rect x="15" y="95" width="140" height="45" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="85" y="115" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dual AI Detectors</text>
    <text x="85" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">ViT-Base &amp; Swin-Base</text>

    <rect x="165" y="95" width="140" height="45" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="235" y="115" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Tesseract OCR</text>
    <text x="235" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Packaging Text (82.7%)</text>
  </g>

  <!-- Connectors to Cross-Modal Verification -->
  <path d="M 260 340 L 260 370 L 450 370" fill="none" stroke="#64748b" stroke-width="1.5" />
  <path d="M 740 340 L 740 370 L 550 370" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- Middle: Cross-Modal Verification -->
  <g transform="translate(320, 355)">
    <rect width="360" height="55" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
    <text x="180" y="24" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Multimodal Inconsistency Engine</text>
    <text x="180" y="42" text-anchor="middle" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10">Title Claim vs. Packaging OCR • Shared-Image Drift (68 candidates)</text>
  </g>

  <line x1="500" y1="410" x2="500" y2="435" stroke="#64748b" stroke-width="1.5" />

  <!-- Relationship Network Graph -->
  <g transform="translate(250, 435)">
    <rect width="500" height="60" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="250" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Marketplace Relationship Network</text>
    <text x="250" y="46" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">5,709 Entity Nodes • 21,395 Edges • 2,133 Components (Exact &amp; Visual Reuse)</text>
  </g>

  <line x1="500" y1="495" x2="500" y2="520" stroke="#64748b" stroke-width="1.5" />

  <!-- Unified Feature Store -->
  <g transform="translate(250, 520)">
    <rect width="500" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
    <text x="250" y="24" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Unified Feature Store (Phase I)</text>
    <text x="250" y="40" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10">2,980 Rows (1 Row = 1 Listing) • 137 Analytical Features (63 Num, 40 Cat, 34 Bin)</text>
  </g>

  <line x1="500" y1="570" x2="500" y2="595" stroke="#64748b" stroke-width="1.5" />

  <!-- Statistical Novelty Modeling -->
  <g transform="translate(250, 595)">
    <rect width="500" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="250" y="24" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Multivariate Statistical Novelty (Phase J)</text>
    <text x="250" y="42" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Isolation Forest across 4 Feature Spaces (Price, Text, Image, Multimodal) • Persistence (3 Outliers)</text>
  </g>

  <line x1="500" y1="650" x2="500" y2="675" stroke="#64748b" stroke-width="1.5" />

  <!-- Final Synthesis & Investigator Output -->
  <g transform="translate(200, 675)">
    <rect width="600" height="75" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" filter="url(#glow)" />
    <text x="300" y="26" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">Final Evidence Synthesis &amp; Review Queue</text>
    <text x="300" y="46" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">213 Multi-Signal Candidate Pairs (≥2 Independent Forensic Layers)</text>
    <text x="300" y="64" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Structured Review Queue • Zero Risk Scoring • Explainable Case Studies</text>
  </g>

  <!-- Legend bottom -->
  <g transform="translate(150, 765)">
    <circle cx="20" cy="10" r="5" fill="#38bdf8" />
    <text x="32" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Derived</text>

    <circle cx="120" cy="10" r="5" fill="#10b981" />
    <text x="132" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Observed</text>

    <circle cx="230" cy="10" r="5" fill="#a855f7" />
    <text x="242" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Candidate</text>

    <circle cx="340" cy="10" r="5" fill="#f59e0b" />
    <text x="352" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Unverified</text>

    <circle cx="450" cy="10" r="5" fill="#64748b" />
    <text x="462" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Unknown</text>
  </g>
</svg>
